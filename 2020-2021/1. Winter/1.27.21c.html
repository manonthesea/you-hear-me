    <title>The Drift</title>
    <link rel="stylesheet" href="../../assets/poem.css">
</head>
<body>
<div class="poem">
    <h1>The Drift</h1>
    <pre>
<span class="line-number">1</span> is
<span class="line-number">2</span> a knowing
<span class="line-number">3</span> that existence
<span class="line-number">4</span> is a pool
<span class="line-number">5</span> of bubbles —
<span class="line-number">6</span> imaginary,
<span class="line-number">7</span> profound, 
<span class="line-number">8</span> and bumping
<span class="line-number">9</span> into each other,
<span class="line-number">10</span> melding,
<span class="line-number">11</span> breaking,
<span class="line-number">12</span> and creating
<span class="line-number">13</span> <a href="1.27.21a.html">a multitude</a> 
<span class="line-number">14</span> of smaller bubbles;
<span class="line-number">15</span> the drift is
<span class="line-number">16</span> the feeling of
<span class="line-number">17</span> getting 
<span class="line-number">18</span> wet.

<em>1.27.21</em>
    </pre>

</div>
</body>
</html>
