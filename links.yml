# The web of cross-poem links.
#
# Each entry says: in poem <from>, find <phrase>, and link it to <to> /
# <asset> / <href>. The build applies these after poems are synced from
# Drive - nothing is pasted into a Doc.
#
# Poems are named by a slug bound to their Drive Doc ID, because paths
# and titles both change. Run "npm run poems:ids" to regenerate the
# poems block; the Doc a slug is bound to must not change afterwards.
#
# Anchors match whole words, case-sensitively, with curly quotes folded,
# and must occur exactly once in the poem (verse and footnotes together).
# If one becomes ambiguous, lengthen it - never number the occurrence.

