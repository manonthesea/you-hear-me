# Per-image plates. Every image linked from a poem gets a black page of
# its own where clicking returns the reader to the poem they came from;
# this section only says how a particular one should differ.
assets:
  # Opens whole, at its own size. The first click magnifies it; the click
  # after that leads to SNAFU rather than back to Pissing Diptych.
  #
  # Patton stands on the left of the frame, so the magnified view is
  # framed there rather than wherever the reader happened to click.
  "patton-pissing.jpg":
    title: Patton on the Rhine
    zoom: 3
    zoom-on: click
    focus: left
    to: snafu

  # The kamikaze photograph the poem is named for, with the
  # chrysanthemums painted back into it. Clicking returns the reader to
  # the poem, which is the default and so needs nothing said here.
  "floating-chrysanthemums.jpg":
    title: Floating Chrysanthemums

  "DA560EC6-116C-41A4-86A7-1698A5907497.jpeg":
    title: Who Goes with Fergus?
    overlay:
      image: Yeats.png
      alt: Yeats
      href: index.html

# Pictures that live on someone else's server. Shown on a plate of our
# own, so a click can lead somewhere in the collection instead of
# stranding the reader on a bare image on a strange site.
#
# "frame: image" draws the picture the way a local one is drawn - whole,
# centred on black. "frame: iframe" puts the URL in an actual frame,
# which for a bare image file means the browser renders it at full size
# and the plate shows a cropped corner of it.
embeds:
  tomb-of-the-wrestlers:
    title: The Tomb of the Wrestlers
    src: "https://www.renemagritte.org/assets/img/paintings/the-tomb-of-the-wrestlers.jpg"
    frame: image
    to: le-maison-du-ren-magritte

  # Illustrates the line it hangs on rather than pointing elsewhere, so
  # it takes the default and hands the reader back to the poem.
  empire-of-light:
    title: The Empire of Light
    src: "https://www.guggenheim.org/wp-content/uploads/1953/01/76.2553.102_ph_web-1.jpg"
    frame: image

