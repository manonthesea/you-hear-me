# How the Worker gets deployed.
#
# It is connected to this repository in the Cloudflare dashboard, with
# the root directory set to "worker", so a merge to main deploys it the
# way a merge already publishes everything else. Nothing is pasted into
# a browser editor any more.
#
# The namespace id below is an identifier, not a secret: it names which
# store the binding points at, and holds no authority over it. Knowing
# it lets nobody read or write the store.
name = "you-hear-me-trail"
main = "trail.js"
compatibility_date = "2026-09-19"

[[kv_namespaces]]
binding = "TRAIL"
id = "b256ec6b991c4e4f90e3effa9814c837"
