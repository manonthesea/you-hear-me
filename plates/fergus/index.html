<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Goes with Fergus?</title>
    <style>
        /* Black, edge to edge: the image is the whole page. */
        html, body { height: 100%; }
        body {
            margin: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            /* The overlay is positioned against this. */
            position: relative;
            overflow: hidden;
        }
        /*
         * Shrink-wraps the image, so anything positioned against it is
         * placed relative to the picture rather than the window.
         */
        .stage {
            position: relative;
            display: inline-block;
            line-height: 0;
            max-width: 100%;
            max-height: 100%;
        }
        .plate {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        .plate img {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }



        /*
         * Over the right-hand side of the picture. Both numbers are
         * percentages of the image's width, so the composition holds on a
         * phone as well as a desktop.
         */
        .overlay { position: absolute; }
        .overlay .press { display: block; }
        .overlay img { display: block; width: 100%; height: auto; }
        .overlay:focus-visible, .plate:focus-visible { outline: 2px solid #58a6ff; }
        .overlay-1 { width: 34%; right: 0%; top: 50%; transform: translateY(-50%); }
        .overlay-1 img { animation: bounce 2.6s linear infinite; }
        .overlay-1 .press { transition: transform 120ms ease; }
        .overlay-1:hover .press { transform: scale(1.04); }
        .overlay-1:active .press { transform: scale(0.92); }
        /* A bounce, not a float. The button rests on the picture rather
           than hovering over it: it springs, slows as it rises, hangs an
           instant at the top, falls back faster than it left, lands, and
           takes one smaller hop before settling. Each leg carries its own
           easing, which is what separates a bounce from a sine wave - out
           of the ground it decelerates, into the ground it accelerates.
           The still moment at the end is the rest between bounces.

           Percentages are of the button's own height, so a small button
           bounces a small distance and the motion reads the same at every
           size. */
        @keyframes bounce {
            0% { transform: translateY(0); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            32% { transform: translateY(-28%); animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53); }
            58% { transform: translateY(0); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            70% { transform: translateY(-8%); animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53); }
            80%, 100% { transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .overlay img { animation: none; }
            /* The give under the finger stays - it is feedback, not
               decoration - but it arrives at once instead of easing. */
            .overlay .press { transition: none; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <a class="plate" id="back" href="../../2020-2021/3.%20Summer/10.19.20.html">
            <img src="../../Fergus.jpeg" alt="Who Goes with Fergus?">
        </a>
        <a class="overlay overlay-1" href="../../index.html" aria-label="Yeats">
            <span class="press"><img src="../../Yeats.png" alt="Yeats"></span>
        </a>
    </div>
    <script>
        // Prefer wherever the reader actually came from, but only within
        // this site - an off-site referrer must not become the way back.
        try {
            const from = document.referrer;
            if (from && new URL(from).origin === location.origin
                && new URL(from).pathname !== location.pathname) {
                document.getElementById('back').href = from;
            }
        } catch (e) { /* keep the static fallback */ }


    </script>
</body>
</html>
