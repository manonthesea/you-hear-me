<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitanza, Seeing</title>
    <style>
        /* Black, edge to edge: the image is the whole page. */
        html, body { height: 100%; }
        body {
            margin: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            /* The overlay is positioned against this. */
            position: relative;
            overflow: hidden;
        }
        /*
         * Shrink-wraps the image, so anything positioned against it is
         * placed relative to the picture rather than the window.
         */
        .stage {
            position: relative;
            display: inline-block;
            line-height: 0;
            max-width: 100%;
            max-height: 100%;
        }
        .plate {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        .plate img {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }

        /*
         * A picture on someone else's server, in a frame. Full bleed,
         * because its proportions are not knowable from here - there is
         * nothing to shrink-wrap the way a local image is shrink-wrapped.
         */
        .stage { position: absolute; inset: 0; max-width: none; max-height: none; }
        .embed { display: block; width: 100%; height: 100%; border: 0; }
        /*
         * The whole surface is the button. A click inside a cross-origin
         * frame never reaches this page, so the link cannot wrap the frame
         * the way it wraps an image - it has to lie on top of it.
         */
        .cover { position: absolute; inset: 0; display: block; cursor: pointer; }
        .cover:focus-visible { outline: 2px solid #58a6ff; outline-offset: -4px; }
        /*
         * Above the cover, so it stays clickable, and there whether or
         * not the frame loaded. A site that refuses to be framed renders
         * nothing at all inside one, and without this the plate would be
         * a blank page with no way onward.
         */
        .ways {
            position: absolute;
            right: 0;
            bottom: 0;
            z-index: 2;
            display: flex;
            gap: 1rem;
            padding: 0.5rem 0.9rem;
            font: 12px/1.4 ui-monospace, 'SF Mono', Menlo, monospace;
            background: rgba(0, 0, 0, 0.72);
            border-top-left-radius: 6px;
        }
        .ways a { color: #9aa4b2; text-decoration: none; white-space: nowrap; }
        .ways a:hover, .ways a:focus-visible { color: #e6edf3; text-decoration: underline; }


        /*
         * Over the right-hand side of the picture. Both numbers are
         * percentages of the image's width, so the composition holds on a
         * phone as well as a desktop.
         */
        .overlay { position: absolute; }
        .overlay .press { display: block; }
        .overlay img { display: block; width: 100%; height: auto; }
        .overlay:focus-visible, .plate:focus-visible { outline: 2px solid #58a6ff; }

        /* A bounce, not a float. The button rests on the picture rather
           than hovering over it: it springs, slows as it rises, hangs an
           instant at the top, falls back faster than it left, lands, and
           takes one smaller hop before settling. Each leg carries its own
           easing, which is what separates a bounce from a sine wave - out
           of the ground it decelerates, into the ground it accelerates.
           The still moment at the end is the rest between bounces.

           Percentages are of the button's own height, so a small button
           bounces a small distance and the motion reads the same at every
           size. */
        @keyframes bounce {
            0% { transform: translateY(0); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            32% { transform: translateY(-28%); animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53); }
            58% { transform: translateY(0); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            70% { transform: translateY(-8%); animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53); }
            80%, 100% { transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .overlay img { animation: none; }
            /* The give under the finger stays - it is feedback, not
               decoration - but it arrives at once instead of easing. */
            .overlay .press { transition: none; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <iframe class="embed" src="https://www.earthwidemoth.com/blog/2006/07/27/vitanza-seeing/" title="Vitanza, Seeing"
                referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups" loading="lazy"></iframe>
        <a class="cover" id="back" href="../../2016-2017!/3.%20Summer/7.21.17.html" aria-label="Back"></a>
        <p class="ways">

            <a href="https://www.earthwidemoth.com/blog/2006/07/27/vitanza-seeing/" target="_blank" rel="noopener noreferrer">open www.earthwidemoth.com &#8599;</a>
        </p>
    </div>
    <script>
        // Prefer wherever the reader actually came from, but only within
        // this site - an off-site referrer must not become the way back.
        try {
            const from = document.referrer;
            if (from && new URL(from).origin === location.origin
                && new URL(from).pathname !== location.pathname) {
                document.getElementById('back').href = from;
            }
        } catch (e) { /* keep the static fallback */ }


    </script>
</body>
</html>
