<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crossing at the Pagus</title>
    <style>
        /* Black, edge to edge: the image is the whole page. */
        html, body { height: 100%; }
        body {
            margin: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            /* The overlay is positioned against this. */
            position: relative;
            overflow: hidden;
        }
        /*
         * Shrink-wraps the image, so anything positioned against it is
         * placed relative to the picture rather than the window.
         */
        .stage {
            position: relative;
            display: inline-block;
            line-height: 0;
            max-width: 100%;
            max-height: 100%;
        }
        .plate {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        .plate img {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }



        /*
         * Over the right-hand side of the picture. Both numbers are
         * percentages of the image's width, so the composition holds on a
         * phone as well as a desktop.
         */
        .overlay { position: absolute; }
        .overlay .press { display: block; }
        .overlay img { display: block; width: 100%; height: auto; }
        .overlay:focus-visible, .plate:focus-visible { outline: 2px solid #58a6ff; }
        .overlay-1 { width: 20%; left: 32%; bottom: 8%; }
        .overlay-1 .press { transition: transform 120ms ease; }
        .overlay-1:hover .press { transform: scale(1.04); }
        .overlay-1:active .press { transform: scale(0.92); }
        /* Percentages here are of the button's own height, so a small
           button bobs a small distance and the motion reads the same at
           every size. */
        @keyframes bob {
            from, to { transform: translateY(0); }
            50% { transform: translateY(-9%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .overlay img { animation: none; }
            /* The give under the finger stays - it is feedback, not
               decoration - but it arrives at once instead of easing. */
            .overlay .press { transition: none; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <a class="plate" id="back" href="../../$Pre-2010/4.27.9.html">
            <img src="../../Polisimage.jpg" alt="The Crossing at the Pagus">
        </a>
        <a class="overlay overlay-1" href="../../2022-2023+/1.%20Winter/12.28.22.html" aria-label="A running hare">
            <span class="press"><img src="../../Rabbit%20Running.png" alt="A running hare"></span>
        </a>
    </div>

</body>
